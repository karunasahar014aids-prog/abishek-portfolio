name: Sync live photography gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Patch portfolio gallery
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'script.js';
            const marker = '/* LIVE PORTFOLIO SUPABASE SYNC v1 */';
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main'
            });

            const current = Buffer.from(file.content, 'base64').toString('utf8');
            if (current.includes(marker)) {
              core.info('Live gallery sync is already installed.');
              return;
            }

            const addition = `

${marker}
(function(){
  const LIVE_SUPABASE_URL = 'https://jaryhmtzzassnzomtsch.supabase.co';
  const LIVE_SUPABASE_ANON_KEY = 'sb_publishable_7VIks8jFhtcJtJOMzI5CKA_fPLazRUA';

  async function loadLivePortfolioPhotos(){
    if(!window.supabase || !Array.isArray(window.galleryData)) return;

    try{
      window.galleryData = galleryData;
      window.renderGallery = renderGallery;

      const client = window.supabase.createClient(LIVE_SUPABASE_URL, LIVE_SUPABASE_ANON_KEY);
      const { data, error } = await client
        .from('posters')
        .select('id,title,category,location,date,description,image_url,display_order,published')
        .eq('published', true)
        .not('image_url', 'is', null)
        .order('display_order', { ascending:true });

      if(error) throw error;

      const existing = new Set(galleryData.map(item => item.img));
      const allowed = ['street','covers','picsarts','posters'];
      const liveItems = (data || [])
        .filter(item => !existing.has(item.image_url))
        .map((item, index) => ({
          cat: allowed.includes(String(item.category || '').toLowerCase()) ? String(item.category).toLowerCase() : 'posters',
          title: item.title || 'New Photograph',
          loc: item.location || 'Studio',
          date: item.date || new Date().getFullYear(),
          desc: item.description || 'Photography portfolio work.',
          story: '',
          img: item.image_url,
          h: 520,
          liveId: item.id || ('live-' + index)
        }));

      if(!liveItems.length) return;
      liveItems.forEach(item => galleryData.push(item));

      const active = document.querySelector('.filter-btn.active');
      const filter = active ? active.dataset.cat : 'all';
      if(typeof renderGallery === 'function') renderGallery(filter);
      if(typeof refreshRevealTargets === 'function') refreshRevealTargets();
      if(typeof bindMagnetic === 'function') bindMagnetic();
    }catch(error){
      console.warn('Live photography sync failed:', error);
    }
  }

  window.addEventListener('load', () => setTimeout(loadLivePortfolioPhotos, 250));
})();
`;

            const updated = current + addition;
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Add live Supabase photography sync',
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha: file.sha,
              branch: 'main'
            });
            core.info('Live photography sync installed.');
