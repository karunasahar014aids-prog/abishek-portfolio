name: Fix live admin gallery

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch live gallery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Ensure the plugin loader is actually loaded by the main page.
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          tag = '<script src="photography-animations.js"></script>'
          if tag not in html:
              html = html.replace('</body>', f'  {tag}\n\n</body>', 1)
              index.write_text(html, encoding='utf-8')
              print('Added photography-animations.js to index.html')

          # The live admin photo was being appended after the large static
          # gallery, so it could be hidden behind Load More. Put live photos first.
          js = Path('script.js')
          text = js.read_text(encoding='utf-8')
          text = text.replace('galleryData.push({', 'galleryData.unshift({', 1)
          js.write_text(text, encoding='utf-8')
          print('Patched admin gallery insertion order')
          PY

      - name: Commit gallery fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js
          if git diff --cached --quiet; then
            echo 'No gallery changes needed'
          else
            git commit -m 'fix: show published admin photos first in portfolio'
            git push
          fi
