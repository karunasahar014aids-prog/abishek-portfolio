name: Restore portfolio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore working portfolio and apply black-gold theme
        shell: bash
        run: |
          set -e
          git checkout 5d93d0c2cc2c157d25e6c932eb6b85050e03585f -- index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="photography-animations.css">'
          if 'black-gold-theme.css' not in s and marker in s:
              s = s.replace(marker, marker + '\n  <link rel="stylesheet" href="black-gold-theme.css">')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/restore-portfolio.yml

      - name: Commit restored portfolio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-portfolio.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore portfolio and apply black gold theme"
          git push origin HEAD:main
