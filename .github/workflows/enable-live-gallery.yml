name: Enable live photography gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure photography plugin is loaded by the main page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="photography-animations.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('index.html does not contain </body>')
              s = s.replace(marker, f'  {tag}\n\n{marker}', 1)
              p.write_text(s, encoding='utf-8')
              print('Added photography-animations.js to index.html')
          else:
              print('Photography plugin is already loaded')
          PY

      - name: Commit change if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed"
          else
            git add index.html
            git commit -m "fix: load live photography plugin on main page"
            git push
          fi
