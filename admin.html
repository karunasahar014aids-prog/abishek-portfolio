<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abishek Studio | Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="admin-main">
<div class="login-wrapper"><div class="login-card">
<div class="brand-mark">AS</div><span class="eyebrow">ABISHEK STUDIO</span><h1>Photography Admin</h1>
<p class="login-description">Manage your photography portfolio, galleries, projects and website content.</p>
<div class="input-group"><label>EMAIL</label><input type="email" id="email" placeholder="Admin Email"></div>
<div class="input-group"><label>PASSWORD</label><div class="password-box"><input type="password" id="password" placeholder="Password"><button type="button" class="password-toggle" onclick="togglePassword()">◉</button></div></div>
<button class="login-btn" onclick="login()"><span>Login to Dashboard</span><b>→</b></button><p id="message" class="login-message"></p>
</div></div>
</main>
<script src="admin.js"></script><script src="admin-fix.js"></script><script src="admin-upload-fix.js"></script><script src="admin-category-fix.js"></script><script src="admin-content.js"></script>
