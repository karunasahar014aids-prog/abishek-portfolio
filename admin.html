<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#050611"><meta name="description" content="Secure Abishek Studio photography portfolio administration.">
<title>Studio Control | Abishek Studio</title>
<link rel="stylesheet" href="admin.css?v=liquid-glass-20261025">
</head>
<body>
<main class="admin-main">
<div class="login-wrapper"><div class="login-card">
<div class="brand-mark">AS</div><span class="eyebrow">ABISHEK STUDIO / CONTROL ROOM</span><h1>Photography Admin</h1>
<p class="login-description">Manage your photography portfolio, galleries, projects and website content.</p>
<form id="email-login-form" onsubmit="loginWithEmail(event)">
<div class="input-group"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="username" placeholder="Admin email" required></div>
<div class="input-group"><label for="password">PASSWORD</label><div class="password-box"><input id="password" type="password" autocomplete="current-password" placeholder="Your password" required><button class="password-toggle" type="button" onclick="togglePassword()" aria-label="Show or hide password">Show</button></div></div>
<button class="login-btn" type="submit"><span>Sign in with Email</span><b>→</b></button>
</form>
<div style="text-align:center;color:var(--muted);margin:18px 0;font-size:12px;letter-spacing:1px">OR</div>
<button class="login-btn google-login-btn" onclick="loginWithGoogle()" type="button"><span>Continue with Google</span><b>→</b></button>
<p class="login-description google-note" style="margin-top:18px;margin-bottom:0">Use the authorized admin email. Email/password users must first be created in Supabase Authentication.</p>
<p id="message" class="login-message" aria-live="polite"></p>
</div></div>
</main>
<script src="admin.js"></script><script src="admin-fix.js"></script><script src="admin-upload-fix.js"></script><script src="admin-category-fix.js"></script><script src="admin-content.js"></script>
</body></html>
